<aside id="cabinet-sidebar" class="cabinet-sidebar" aria-label="Проанализированные файлы">
  <div class="cabinet-header">
    <div>
      <h2>Проанализированные файлы</h2>
      <p class="muted">{{ current_username }}</p>
    </div>
  </div>

  {% if cabinet_jobs %}
    <div class="cabinet-list">
      {% for item in cabinet_jobs %}
        <article class="cabinet-item status-left-{{ item.status }}" data-history-url="/ui/result/{{ item.job_id }}" tabindex="0">
          <div class="cabinet-item-main">
            <a class="cabinet-title" href="/ui/result/{{ item.job_id }}">{{ item.title }}</a>
            <span class="cabinet-meta">{{ item.status_label }}</span>
          </div>
          {% if item.download_file %}
            <a class="cabinet-download" href="/ui/download/{{ item.job_id }}/{{ item.download_file }}" title="Скачать">↓</a>
          {% endif %}
        </article>
      {% endfor %}
    </div>
  {% else %}
    <p class="muted cabinet-empty">Сохранённые результаты появятся после первой обработки.</p>
  {% endif %}
</aside>
